[package]
name = "screenux-rs"
version = "0.2.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "A modern screen session manager with enhanced logging and tracking"

[dependencies]
clap = { version = "4.5.1", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
directories = "5.0"
uuid = { version = "1.7", features = ["v4", "serde"] }
tokio = { version = "1.36", features = ["full"] }
async-trait = "0.1"
log = "0.4"
env_logger = "0.11"
which = "6.0"
